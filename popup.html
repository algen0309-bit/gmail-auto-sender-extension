<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 300px;
      padding: 16px;
      margin: 0;
    }
    h2 {
      font-size: 15px;
      margin: 0 0 14px;
      color: #1a73e8;
    }
    .delay-section {
      margin-bottom: 14px;
      background: #f8f9fa;
      border-radius: 6px;
      padding: 10px 12px;
    }
    .delay-title {
      font-size: 12px;
      font-weight: 600;
      color: #444;
      margin-bottom: 10px;
    }
    .range-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .range-row label {
      font-size: 11px;
      color: #666;
      width: 28px;
      flex-shrink: 0;
    }
    .range-row input[type="range"] {
      flex: 1;
      accent-color: #1a73e8;
      cursor: pointer;
    }
    .range-row .val {
      font-size: 12px;
      font-weight: 700;
      color: #1a73e8;
      width: 46px;
      text-align: right;
      flex-shrink: 0;
    }
    .range-hint {
      font-size: 10px;
      color: #999;
      text-align: center;
      margin-top: 4px;
    }
    #sendBtn {
      width: 100%;
      padding: 10px;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }
    #sendBtn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }
    #status {
      margin-top: 12px;
      list-style: none;
      padding: 0;
      font-size: 13px;
    }
    #status li {
      padding: 4px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <h2>Gmail Auto Sender</h2>

  <div class="delay-section">
    <div class="delay-title">Random delay between emails</div>

    <div class="range-row">
      <label>From</label>
      <input type="range" id="minSlider" min="1" max="300" step="1" value="10" />
      <span class="val" id="minValue">10s</span>
    </div>

    <div class="range-row">
      <label>To</label>
      <input type="range" id="maxSlider" min="1" max="300" step="1" value="60" />
      <span class="val" id="maxValue">1m</span>
    </div>

    <div class="range-hint">1s &nbsp;–&nbsp; 5 min</div>
  </div>

  <div class="delay-section">
    <div class="delay-title">Tracker pixel wait timeout</div>
    <div class="range-row">
      <label>Wait</label>
      <input type="range" id="trackerSlider" min="2" max="15" step="1" value="5" />
      <span class="val" id="trackerValue">5s</span>
    </div>
    <div class="range-hint">Max time to wait for Mailsuite to inject pixel</div>
  </div>

  <button id="sendBtn">Send All Open Compose Tabs</button>
  <ul id="status"></ul>
  <script src="popup.js"></script>
</body>
</html>
