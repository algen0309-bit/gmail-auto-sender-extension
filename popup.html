<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 300px;
      padding: 16px;
      margin: 0;
    }
    h2 {
      font-size: 15px;
      margin: 0 0 14px;
      color: #1a73e8;
    }
    .delay-section {
      margin-bottom: 14px;
      background: #f8f9fa;
      border-radius: 6px;
      padding: 10px 12px;
    }
    .delay-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #444;
      margin-bottom: 6px;
    }
    .delay-label span:first-child {
      font-weight: 600;
    }
    #delayValue {
      font-size: 13px;
      font-weight: 700;
      color: #1a73e8;
      min-width: 52px;
      text-align: right;
    }
    #delaySlider {
      width: 100%;
      accent-color: #1a73e8;
      cursor: pointer;
    }
    .delay-range-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #999;
      margin-top: 2px;
    }
    #sendBtn {
      width: 100%;
      padding: 10px;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }
    #sendBtn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }
    #status {
      margin-top: 12px;
      list-style: none;
      padding: 0;
      font-size: 13px;
    }
    #status li {
      padding: 4px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <h2>Gmail Auto Sender</h2>

  <div class="delay-section">
    <div class="delay-label">
      <span>Delay between emails</span>
      <span id="delayValue">30s</span>
    </div>
    <input type="range" id="delaySlider" min="10" max="300" step="5" value="30" />
    <div class="delay-range-labels">
      <span>10s</span>
      <span>5 min</span>
    </div>
  </div>

  <button id="sendBtn">Send All Open Compose Tabs</button>
  <ul id="status"></ul>
  <script src="popup.js"></script>
</body>
</html>
